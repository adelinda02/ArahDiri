name: Test and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: php artisan test
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.image.outputs.version }}
      release: ${{ steps.image.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.release }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_IMAGE: ${{ needs.publish.outputs.image }}
          APP_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/arahdiri'
          scp compose.yaml "$VPS_USER@$VPS_HOST:/opt/arahdiri/compose.yaml"
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/arahdiri && APP_IMAGE='$APP_IMAGE' APP_VERSION='$APP_VERSION' docker compose -f compose.yaml pull app && APP_IMAGE='$APP_IMAGE' APP_VERSION='$APP_VERSION' docker compose -f compose.yaml run --rm app php artisan migrate --force && APP_IMAGE='$APP_IMAGE' APP_VERSION='$APP_VERSION' docker compose -f compose.yaml up -d app"
